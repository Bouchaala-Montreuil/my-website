<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f2" />
    <script>
      document.documentElement.classList.add("js");
      // The full-screen brand loader was removed: on paid traffic it delayed
      // the only sentence that matters by more than a second.
      window.setTimeout(function () {
        if (!document.documentElement.classList.contains("motion-on")) {
          document.documentElement.classList.add("no-motion");
        }
      }, 8000);
      // Incoming page for the transitions: hide the first paint until the
      // overlay is in place, and release it even if hydration never happens.
      try {
        if (sessionStorage.getItem("feekza:transition") === "1") {
          document.documentElement.classList.add("pt-load");
          window.setTimeout(function () {
            document.documentElement.classList.remove("pt-load");
          }, 2500);
        }
      } catch (error) {
        /* storage blocked */
      }
    </script>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
