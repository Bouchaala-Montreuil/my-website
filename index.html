<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C1C1C" />

    <!-- Primary SEO (French market first) -->
    <title>Feekza — Site web sur mesure | 195 €/mois tout compris</title>
    <meta name="description" content="Feekza crée votre site web sur mesure : jusqu'à 5 pages, hébergement, email professionnel, maintenance 24/7 et modifications illimitées. 195 €/mois, première version en 48–72h, satisfait ou remboursé." />
    <link rel="canonical" href="https://feekza.com/" />

    <!-- Open graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://feekza.com/" />
    <meta property="og:title" content="Feekza — Site web sur mesure | 195 €/mois tout compris" />
    <meta property="og:description" content="Site web sur mesure, hébergement, email pro, maintenance 24/7 et modifications illimitées. Un seul prix : 195 €/mois. Première version en 48–72h." />
    <meta property="og:image" content="https://feekza.com/wordmark.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Feekza — Site web sur mesure | 195 €/mois tout compris" />
    <meta name="twitter:description" content="Site web sur mesure, hébergement, email pro, maintenance 24/7 et modifications illimitées. Un seul prix : 195 €/mois." />

    <!-- Language alternates (one URL, client-side language switching) -->
    <link rel="alternate" hreflang="fr" href="https://feekza.com/" />
    <link rel="alternate" hreflang="en" href="https://feekza.com/" />
    <link rel="alternate" hreflang="ar" href="https://feekza.com/" />
    <link rel="alternate" hreflang="x-default" href="https://feekza.com/" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["ProfessionalService", "Organization"],
      "name": "Feekza",
      "url": "https://feekza.com/",
      "email": "hello@feekza.com",
      "description": "Création de sites web sur mesure : jusqu'à 5 pages, hébergement, email professionnel, maintenance 24/7 et modifications illimitées pour 195 €/mois.",
      "areaServed": "FR",
      "priceRange": "€€",
      "makesOffer": {
        "@type": "Offer",
        "name": "Site web sur mesure",
        "description": "Site web personnalisé jusqu'à 5 pages avec hébergement, email professionnel, maintenance 24/7 et modifications illimitées.",
        "price": "195.00",
        "priceCurrency": "EUR",
        "priceSpecification": {
          "@type": "UnitPriceSpecification",
          "price": "195.00",
          "priceCurrency": "EUR",
          "billingIncrement": 1,
          "billingPeriod": "P1M"
        }
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does €195/month include?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A custom website (up to 5 pages), hosting, a professional email address, 24/7 maintenance, and any modification — plus your domain free the first year."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a commitment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — 6 months minimum, then cancel anytime with 1 month's notice."
          }
        },
        {
          "@type": "Question",
          "name": "How long does delivery take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your first version within 48–72 hours. Revisions within 24 hours."
          }
        },
        {
          "@type": "Question",
          "name": "What if I don't like the preview?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ask for changes — or a full refund, no questions asked. The order only finalizes when you approve the preview."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if I stop paying?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your site goes into sleep mode (offline, kept 30 days). Your domain — after year one — and your content always stay yours."
          }
        },
        {
          "@type": "Question",
          "name": "Can I add features later?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Extra features (online shop, booking system…) are quoted separately — you always know the price before we start."
          }
        }
      ]
    }
    </script>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23E85D4A'/%3E%3Ctext x='50' y='70' font-size='58' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif;">
        Feekza creates custom websites — 195 €/month, everything included. Please enable JavaScript to view the site.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
