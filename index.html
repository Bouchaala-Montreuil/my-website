<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f2" />
    <script>
      document.documentElement.classList.add("js");
      // the brand loader is a first-visit ritual: one per session, skipped for
      // anyone who asks for reduced motion
      try {
        if (!sessionStorage.getItem("feekza:loader")) {
          document.documentElement.classList.add("loader");
          sessionStorage.setItem("feekza:loader", "1");
          var mark = document.createElement("link");
          mark.rel = "preload";
          mark.as = "image";
          mark.type = "image/webp";
          mark.href = "/brand/feekza-f.webp";
          document.head.appendChild(mark);
          // CSS takes the loader away on its own; this only releases the
          // scroll lock if the bundle never gets there.
          window.setTimeout(function () {
            document.documentElement.classList.remove("loader");
          }, 5000);
        }
      } catch (error) {
        /* storage blocked: no loader */
      }
      window.setTimeout(function () {
        if (!document.documentElement.classList.contains("motion-on")) {
          document.documentElement.classList.add("no-motion");
        }
      }, 8000);
      // Incoming page for the transitions: hide the first paint until the
      // overlay is in place, and release it even if hydration never happens.
      try {
        if (sessionStorage.getItem("feekza:transition") === "1") {
          document.documentElement.classList.add("pt-load");
          window.setTimeout(function () {
            document.documentElement.classList.remove("pt-load");
          }, 2500);
        }
      } catch (error) {
        /* storage blocked */
      }
    </script>
    <!--seo-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
